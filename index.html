(()=>{let language='en',selected=null,motion=null,request=0;const reduced=matchMedia('(prefers-reduced-motion:reduce)'),menu=document.getElementById('category-menu'),catalog=document.getElementById('creature-catalog'),grid=document.getElementById('creature-grid'),empty=document.getElementById('empty-start'),search=document.getElementById('creature-search'),allButton=document.getElementById('all-creatures');
const words={en:{title:'Creatures',choose:'Choose a family or search for a creature.',source:'Original sprites and creature names',count:'creatures',close:'Close',all:'All creatures',search:'Search creatures by name…',none:'No creatures found.'},pt:{title:'Criaturas',choose:'Escolha uma família ou pesquise uma criatura.',source:'Sprites e nomes originais das criaturas',count:'criaturas',close:'Fechar',all:'Todas as criaturas',search:'Pesquisar criatura pelo nome…',none:'Nenhuma criatura encontrada.'},es:{title:'Criaturas',choose:'Elige una familia o busca una criatura.',source:'Sprites y nombres originales de las criaturas',count:'criaturas',close:'Cerrar',all:'Todas las criaturas',search:'Buscar criatura por nombre…',none:'No se encontraron criaturas.'}};
const normalize=text=>String(text).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const normalizedNames=new Map(CREATURES.map(c=>[c.id,normalize(c.name)]));const cardCache=new Map();function items(){const query=normalize(search.value);return CREATURES.filter(c=>(selected==='all'||c.category===selected)&&(!query||normalizedNames.get(c.id).includes(query)));}
function translate(){document.documentElement.lang=language;document.querySelectorAll('[data-i18n]').forEach(n=>n.textContent=words[language][n.dataset.i18n]);document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===language)));for(const family of FAMILIES)menu.querySelector('[data-family="'+family.id+'"] .category-label').textContent=family.labels[language];search.placeholder=words[language].search;search.setAttribute('aria-label',words[language].search);document.getElementById('close-catalog').setAttribute('aria-label',words[language].close);if(selected){document.getElementById('catalog-title').textContent=selected==='all'?words[language].all:FAMILIES.find(f=>f.id===selected).labels[language];document.getElementById('catalog-count').textContent=items().length+' '+words[language].count;const none=grid.querySelector('.creature-no-results');if(none)none.textContent=words[language].none;}}

async function close(){if(!selected)return;const token=++request;selected=null;search.value='';mark();if(motion)motion.cancel();if(!reduced.matches){motion=catalog.animate([{opacity:1},{opacity:0}],{duration:250,easing:'ease-in-out',fill:'both'});await motion.finished.catch(()=>{});}if(token!==request)return;catalog.hidden=true;empty.hidden=false;if(motion){motion.cancel();motion=null;}}
